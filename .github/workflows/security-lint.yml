name: Supabase Security Lint

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "src/test/security/**"
      - "scripts/security-lint.mjs"
      - "scripts/check-migration-grants.mjs"
      - ".github/workflows/security-lint.yml"
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Check migrations include GRANT statements
        run: node scripts/check-migration-grants.mjs
      - name: Run Supabase security regression check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/security-lint.mjs
      - name: RLS regression suite
        if: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:security